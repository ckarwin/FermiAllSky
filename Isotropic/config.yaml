# This is the wrapper's config, not raw Fermipy YAML.
evfile: /project/ckarwin/astro/data/fermi-lat/weekly/photon/filelist.txt
scfile: /project/ckarwin/astro/data/fermi-lat/mission/spacecraft/lat_spacecraft_merged.fits
catalog: /project/ckarwin/astro/chris/my_envs/joint_analysis_main/lib/python3.11/site-packages/fermipy/data/catalogs/gll_psc_v35.fit
extdir: /project/ckarwin/astro/chris/my_envs/fermipy/lib/python3.9/site-packages/fermipy/data/catalogs/Extended_14years/Templates/

galprop:
  IC:
    file: /project/ckarwin/astro/chris/annihilation_in_flight/GALPROP_Sims/Run_9_test2/results/ics_anisotropic_mapcube_57_SA100_F98_example
    free: true
    normalization: 1.0
  pi0:
    file: /project/ckarwin/astro/chris/annihilation_in_flight/GALPROP_Sims/Run_9_test2/results/pion_decay_mapcube_57_SA100_F98_example
    free: true
    normalization: 1.0
  brem:
    file: /project/ckarwin/astro/chris/annihilation_in_flight/GALPROP_Sims/Run_9_test2/results/bremss_mapcube_57_SA100_F98_example
    free: false
    normalization: 1.0
# Each FREE component gets ONE normalization across ALL energies.
# normalization is the fixed value when free:false, or initial value when free:true.

# No external isotropic spectrum required. The code makes this reference internally.
# Its normalization is arbitrary; every isotropic bin has a freely fitted amplitude.
# index is the assumed shape WITHIN each energy bin, not a globally fitted spectrum.
isotropic:
  mode: powerlaw
  index: -2.0
  pivot_MeV: 1000.0
  intensity_at_pivot: 1.0e-10  # ph cm^-2 s^-1 sr^-1 MeV^-1
# Optional alternative: isotropic: {mode: file, file: /path/to/reference.txt}
allow_seed_extrapolation: false

evclass: 128
evtype: 3
irfs: P8R3_SOURCE_V3
tmin: 239557417
tmax: 780439551
emin: 300.0             # Set 20.0 if desired; input data/IRFs must support it.
emax: 100000.0
binsperdec: 8
binsz: 0.2             # Preserved bookkeeping value; HPX resolution is set below.
hpx_order: 8           # NSIDE=256, characteristic pixel scale ~0.229 deg.
zmax: 90.0
filter: DATA_QUAL>0 && LAT_CONFIG==1
logging:
  chatter: 0
  verbosity: 1
# auto resolves to -2 here (your original used -1); at 20 MeV it selects +4.
edisp_bins: auto
# Verify differential-intensity units, not E^2*dN/dE or unit-normalized maps. Should be ph/cm2/s/sr/MeV 
galprop_intensity_units_confirmed: true  
mask:
  plane_abs_b_min: 30.0
  pole_abs_dec_max: 90.0
  bubbles_abs_l_max: 45.0
  bubbles_abs_b_max: 90.0

# used for energy dispersion if model doesn't cover needed energy range: 
galprop_extrapolation:
  high: true
  low: false
  fit_points: 3
  index_min: -6.0
  index_max: 2.0
  index_shift: 0.0
  max_factor: 3.0
plots:
  bands_MeV: [[300, 1000], [1000, 10000], [10000, 100000], [100000, 800000]]
  map_nlon: 720

additional_diffuse:
  Sun:
    file: /project/ckarwin/astro/chris/annihilation_in_flight/build_analysis_pipeline/Run_19/ThreeML_Analysis/Sun_and_Moon/solar_parallel/sun_template.fits
    free: true
    normalization: 1.0
  Moon:
    file: /project/ckarwin/astro/chris/annihilation_in_flight/build_analysis_pipeline/Run_19/ThreeML_Analysis/Sun_and_Moon/solar_parallel/moon_template.fits
    free: true
    normalization: 1.0

# Paths are relative to THIS YAML; use a new outdir for each preparation.
outdir: output_with_solar_and_loopI_separate
reuse_from: output_with_solar_and_loopI  # Omit or set null for the first preparation.

# Separate Wolleben S1/S2 components: shared spectrum, independent amplitudes.
loopI:
  enabled: true
  mode: separate
  # directory: ../LoopI     # Optional; default is repository-level LoopI/.
  spectrum: empirical       # empirical | powerlaw | cutoff_powerlaw | logparabola
  free_norm: true          # separate: one free norm PER SHELL; combined: one shared norm
  normalization: 0.14        # fixed multiplier, or starting value if free_norm=true
# Analytic choices use parameters, e.g.:
#  spectrum: cutoff_powerlaw
#  parameters:
#    index: {value: 2.4, free: true, min: 0.5, max: 5.0}
#    cutoff_MeV: {value: 30000, free: true, min: 1000, max: 10000000}
# For powerlaw: index only. For logparabola: alpha and beta.
#    alpha: {value: 2.4, free: true, min: 0.5, max: 5.0}
#    beta: {value: 0.1, free: true, min: 0.0, max: 1.0}
compute_profiles: false
# To fit independent S1/S2 amplitudes with the SAME empirical shape:
# use mode: separate and free_norm: true (as configured above).
# Optional independent controls inside loopI (requires mode: separate)
#  shells:
#    S1: {free_norm: true, normalization: 1.0}
#    S2: {free_norm: true, normalization: 1.0}
# Analytic shape parameters remain tied between shells in separate mode.
